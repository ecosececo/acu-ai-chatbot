name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── Job 1: Lint ───────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check acu-ai-chatbot/webapp/ --ignore E501

  # ── Job 2: Test ───────────────────────────────────────────
  test:
    name: Django Tests
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: acu_chatbot
          POSTGRES_USER: acu_user
          POSTGRES_PASSWORD: acu_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U acu_user -d acu_chatbot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://acu_user:acu_secret@localhost:5432/acu_chatbot
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
      DJANGO_DEBUG: "True"
      LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://localhost:11434
      EMBEDDING_MODEL: bge-m3
      EMBEDDING_DIMENSIONS: "1024"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: acu-ai-chatbot/webapp/requirements.txt

      - name: Install dependencies
        working-directory: acu-ai-chatbot/webapp
        run: pip install -r requirements.txt

      - name: Run migrations
        working-directory: acu-ai-chatbot/webapp
        run: python manage.py migrate --noinput

      - name: Run tests
        working-directory: acu-ai-chatbot/webapp
        run: python manage.py test --verbosity=2

  # ── Job 3: Docker Build ───────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build webapp image
        uses: docker/build-push-action@v6
        with:
          context: ./acu-ai-chatbot/webapp
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build nginx image
        uses: docker/build-push-action@v6
        with:
          context: ./acu-ai-chatbot/nginx
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate docker-compose config
        working-directory: acu-ai-chatbot
        run: docker compose config --quiet
